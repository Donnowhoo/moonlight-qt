---
name: Build
permissions:
  contents: read

on:
  push:
  pull_request:
    branches:
      - master

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      ci_version: ${{ steps.set-ci-version.outputs.ci_version }}
    steps:
      - name: Set CI version
        id: set-ci-version
        shell: bash
        run: |
          CI_VERSION=`echo ${GITHUB_SHA} | cut -c1-6`
          echo "ci_version=${CI_VERSION}" >> "${GITHUB_OUTPUT}"

  build-appimage:
    needs: setup
    uses: ./.github/workflows/build-appimage.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}

  build-steamlink:
    needs: setup
    uses: ./.github/workflows/build-steamlink.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}

  build-windows-macos:
    needs: setup
    uses: ./.github/workflows/build-win-mac.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}

  publish-dual-monitor:
    if: github.ref == 'refs/heads/dual-monitor'
    needs: [setup, build-windows-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          pattern: Moonlight-Windows-x64-*
          merge-multiple: true

      - name: Publish dual monitor release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l artifacts
          gh release delete dual-monitor-latest -R "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create dual-monitor-latest artifacts/* \
            -R "${{ github.repository }}" \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Moonlight dual monitor build (${{ needs.setup.outputs.ci_version }})" \
            --notes "Moonlight with dual monitor mode. Install on the client PC."
